name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: affiliate_test
          POSTGRES_PASSWORD: sample-test-password
          POSTGRES_DB: affiliate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U affiliate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://affiliate_test:sample-test-password@127.0.0.1:5432/affiliate_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:http
